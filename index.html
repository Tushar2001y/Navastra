<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAVASTRA-81 | MULTI-MODE HUD</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { 
            --hud-cyan: #00f2ff; 
            --warning-red: #ff0033;
            --deep-red: #8b0000;
            --glass: rgba(10, 15, 25, 0.94); 
        }
        
        body { margin: 0; background: #010409; font-family: 'JetBrains Mono', monospace; color: white; overflow: hidden; }
        
        /* CRT Overlay - Controlled by JS */
        #crt-overlay {
            position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 200; background-size: 100% 4px, 3px 100%; pointer-events: none;
            display: none; /* Default Off */
        }

        model-viewer { width: 100vw; height: 100vh; --poster-color: transparent; }

        /* Intensified Top Bar */
        .header { 
            position: absolute; top: 0; width: 100%; 
            background: linear-gradient(90deg, var(--deep-red), var(--warning-red), var(--deep-red));
            border-bottom: 3px solid white;
            text-align: center; font-size: 10px; letter-spacing: 6px; padding: 14px 0; z-index: 300; 
            font-weight: 900; box-shadow: 0 4px 20px rgba(255,0,0,0.4);
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 4px 10px rgba(255,0,0,0.3); }
            50% { box-shadow: 0 4px 25px rgba(255,0,0,0.6); }
            100% { box-shadow: 0 4px 10px rgba(255,0,0,0.3); }
        }

        /* View Mode Selector */
        .mode-selector {
            position: absolute; top: 70px; right: 40px; z-index: 400;
            display: flex; flex-direction: column; gap: 10px;
        }
        .mode-btn {
            background: var(--glass); border: 1px solid var(--hud-cyan);
            color: var(--hud-cyan); padding: 8px 15px; font-size: 10px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s;
        }
        .mode-btn.active { background: var(--hud-cyan); color: black; font-weight: bold; }
        .mode-btn:hover { background: rgba(0, 242, 255, 0.2); }

        .title-block { position: absolute; top: 75px; left: 40px; z-index: 10; border-left: 4px solid var(--hud-cyan); padding-left: 15px; }
        .title-block h1 { margin: 0; font-size: 32px; color: var(--hud-cyan); font-style: italic; }

        /* Hotspots */
        .hotspot { background: none; border: 1px solid var(--hud-cyan); width: 30px; height: 30px; cursor: pointer; position: relative; }
        .hotspot::before { content: ''; position: absolute; top: -2px; left: -2px; width: 6px; height: 6px; border-top: 2px solid var(--warning-red); border-left: 2px solid var(--warning-red); }
        .hotspot::after { content: ''; position: absolute; bottom: -2px; right: -2px; width: 6px; height: 6px; border-bottom: 2px solid var(--warning-red); border-right: 2px solid var(--warning-red); }

        .annotation { 
            background: var(--glass); border: 1px solid var(--hud-cyan); padding: 15px; width: 280px; 
            position: absolute; transform: translate(45px, -50%); visibility: hidden; opacity: 0; 
            transition: all 0.3s; border-right: 6px solid var(--warning-red);
        }
        .hotspot.active .annotation { visibility: visible; opacity: 1; }
        .annotation strong { color: var(--hud-cyan); display: block; margin-bottom: 5px; border-bottom: 1px solid var(--hud-cyan); }
    </style>
</head>
<body>
    <div id="crt-overlay"></div>
    <div class="header">RESTRICTED ACCESS // NAVASTRA-81 COMMAND INTERFACE</div>
    
    <div class="mode-selector">
        <button class="mode-btn active" onclick="setView('normal')">Normal View</button>
        <button class="mode-btn" onclick="setView('wireframe')">Wire Mesh</button>
        <button class="mode-btn" onclick="setView('crt')">CRT Mode</button>
    </div>

    <div class="title-block">
        <h1>NAVASTRA-81</h1>
        <p style="color:var(--warning-red); font-size: 10px; letter-spacing: 2px;">VISUALIZATION_CORE: ONLINE</p>
    </div>

    <model-viewer id="v" 
                  src="https://raw.githubusercontent.com/Tushar2001y/Navastra/main/NAVASTRA_PRO-Optimized.glb" 
                  draco-decoder-path="https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
                  camera-controls auto-rotate shadow-intensity="2" exposure="1.3">
        
        <button class="hotspot" slot="hotspot-1" data-position="0 110 20" data-normal="0 1 0">
            <div class="annotation"><strong>Airframe</strong>6-arm platform with 66% redundancy.</div>
        </button>
        <button class="hotspot" slot="hotspot-2" data-position="325 325 30" data-normal="1 0 0">
            <div class="annotation"><strong>Propulsion</strong>12.67 kg thrust requirement per motor.</div>
        </button>
        <button class="hotspot" slot="hotspot-3" data-position="0 0 -120" data-normal="0 0 -1">
            <div class="annotation"><strong>Payload</strong>10 kg tactical cargo capacity.</div>
        </button>

    </model-viewer>

    <script>
        const viewer = document.querySelector('#v');
        const crt = document.querySelector('#crt-overlay');

        function setView(mode) {
            // Update buttons
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            // Handle CRT Overlay
            crt.style.display = (mode === 'crt') ? 'block' : 'none';

            // Handle Wireframe logic
            const materials = viewer.model.materials;
            materials.forEach(mat => {
                if (mode === 'wireframe') {
                    mat.setAlphaMode("BLEND");
                    mat.pbrMetallicRoughness.setBaseColorFactor([0, 0.95, 1, 0.3]); // Ghostly blue
                } else {
                    mat.setAlphaMode("OPAQUE");
                    mat.pbrMetallicRoughness.setBaseColorFactor([1, 1, 1, 1]); // Reset
                }
            });
        }

        // On-click functionality preserved
        const h = document.querySelectorAll('.hotspot');
        h.forEach(x => { 
            x.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                h.forEach(btn => btn.classList.remove('active')); 
                x.classList.add('active'); 
            }); 
        });
        viewer.addEventListener('click', () => h.forEach(btn => btn.classList.remove('active')));
    </script>
</body>
</html>
