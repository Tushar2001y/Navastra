<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAVASTRA-81 Tactical HUD</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --hud-green: #00ffcc; --glass-bg: rgba(15, 23, 42, 0.7); }
        body { margin: 0; background: #020617; font-family: 'Segoe UI', system-ui, sans-serif; color: white; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; --poster-color: transparent; }

        /* HUD Top Banner */
        .hud-header { position: absolute; top: 0; width: 100%; background: rgba(153, 27, 27, 0.8); border-bottom: 2px solid #ff3333; text-align: center; font-size: 11px; letter-spacing: 5px; padding: 8px 0; z-index: 100; font-weight: bold; }

        /* HUD Title */
        .hud-title { position: absolute; top: 45px; left: 25px; pointer-events: none; }
        .hud-title h1 { margin: 0; font-size: 28px; letter-spacing: 2px; color: var(--hud-green); text-shadow: 0 0 15px var(--hud-green); }
        .hud-title p { margin: 0; font-size: 12px; opacity: 0.8; text-transform: uppercase; }

        /* Interactive Hotspots */
        .hotspot { background: none; border: 2px solid var(--hud-green); border-radius: 50%; width: 26px; height: 26px; cursor: pointer; box-shadow: 0 0 10px var(--hud-green); transition: all 0.3s; position: relative; }
        .hotspot::after { content: ''; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: var(--hud-green); border-radius: 50%; transform: translate(-50%, -50%); }
        .hotspot:active { transform: scale(1.5); box-shadow: 0 0 20px var(--hud-green); }

        /* Annotation Bubble - Mirroring User Image */
        .annotation { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 4px; color: white; font-size: 13px; padding: 15px; width: 280px; position: absolute; transform: translate(30px, -50%); opacity: 0; visibility: hidden; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-left: 4px solid var(--hud-green); }
        .hotspot:active .annotation, .hotspot:focus .annotation { opacity: 1; visibility: visible; transform: translate(40px, -50%); }

        .annotation strong { color: var(--hud-green); text-transform: uppercase; display: block; margin-bottom: 5px; }

        /* Status Panel (Bottom Left) */
        .status-panel { position: absolute; bottom: 30px; left: 25px; font-size: 11px; opacity: 0.6; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="hud-header">RESTRICTED - NAVASTRA-81 OPERATIONAL BRIEFING</div>
    <div class="hud-title"><h1>NAVASTRA-81</h1><p>Tactical Heavy-Lift Visualization</p></div>

    <model-viewer src="NAVASTRA_81_HighFidelity.glb" camera-controls auto-rotate shadow-intensity="1" stage-light-intensity="3" environment-intensity="2">
        
        <!-- FRAME -->
        <button class="hotspot" slot="hotspot-frame" data-position="0 80 15" data-normal="0 1 0">
            <div class="annotation">
                <strong>Main Airframe</strong>
                • Configuration: Hexacopter (6 Motors)<br>
                • Advantage: Motor failure redundancy (Safe landing with 5/6 motors)<br>
                • Material: Reinforced Carbon Fiber Hub[span_2](start_span)[span_2](end_span)
            </div>
        </button>

        <!-- MOTORS -->
        <button class="hotspot" slot="hotspot-motor" data-position="285 285 25" data-normal="1 0 0">
            <div class="annotation">
                <strong>Propulsion: BLDC Motor</strong>
                • Required Thrust: 12.67 kg per motor<br>
                • Thrust-to-Weight (T/W): 2:1 recommended<br>
                • Indigenous Status: Available domestically (<15 kg)[span_3](start_span)[span_3](end_span)
            </div>
        </button>

        <!-- PROPELLERS -->
        <button class="hotspot" slot="hotspot-prop" data-position="285 285 55" data-normal="0 0 1">
            <div class="annotation">
                <strong>Propeller Specs</strong>
                • Size: 13-15 inch Carbon Fiber<br>
                • Pitch: Optimized for high-altitude lift<br>
                • Status: Indian-made COTS components[span_4](start_span)[span_4](end_span)
            </div>
        </button>

        <!-- PAYLOAD DROPPING MECHANISM -->
        <button class="hotspot" slot="hotspot-drop" data-position="0 0 -35" data-normal="0 0 -1">
            <div class="annotation">
                <strong>Dropping Mechanism</strong>
                • Type: Servo-actuated modular rail<br>
                • Function: Secure tactical delivery and remote release<br>
                • Weight Budget: ~5-10% of total system[span_5](start_span)[span_5](end_span)
            </div>
        </button>

        <!-- PAYLOAD -->
        <button class="hotspot" slot="hotspot-payload" data-position="0 0 -85" data-normal="0 0 -1">
            <div class="annotation">
                <strong>Tactical Payload Module</strong>
                • Capacity: 10 kg Cargo<br>
                • All-Up Weight (AUW): 38 kg (28kg Drone + 10kg Payload)<br>
                • Role: Strategic supply / Loitering munitions transport[span_6](start_span)[span_6](end_span)
            </div>
        </button>

    </model-viewer>

    <div class="status-panel">
        SWIPE TO ORBIT | PINCH TO ZOOM | TAP HUD HOTSPOTS FOR DATA<br>
        ATMANIRBHAR BHARAT DEFENSE ROADMAP | PHASE I
    </div>
</body>
</html>
